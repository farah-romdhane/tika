name: Tache 2 - tests EndianUtils et MediaType

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler tika-core (sans tests)
        run: mvn -B -pl tika-core -am install -Pfast

      - name: Executer les tests (originaux + generes + manuels)
        working-directory: tika-core
        run: mvn -B test "-Dtest=EndianUtils*Test,MediaType*Test" "-Dsurefire.failIfNoSpecifiedTests=false" "-Dcheckstyle.skip"

      - name: Analyse de mutation PIT
        working-directory: tika-core
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage "-Dcheckstyle.skip"

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            tika-core/target/surefire-reports
            tika-core/target/site/jacoco
            tika-core/target/pit-reports