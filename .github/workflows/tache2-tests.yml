name: CI Tika - tests et Semgrep

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler tika-core (sans tests)
        run: mvn -B -pl tika-core -am install -Pfast

      - name: Executer les tests (originaux + generes + manuels)
        id: tests
        working-directory: tika-core
        run: mvn -B test "-Dtest=EndianUtils*Test,MediaType*Test" "-Dsurefire.failIfNoSpecifiedTests=false"

      - name: Rickroll si les tests echouent
        if: failure() && steps.tests.outcome == 'failure'
        uses: ./.github/actions/rickroll

      - name: Analyse de mutation PIT
        working-directory: tika-core
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            tika-core/target/surefire-reports
            tika-core/target/site/jacoco
            tika-core/target/pit-reports

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0

    steps:
      - name: Checkout (avec tout l'historique)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Autoriser git dans le conteneur
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Choisir le commit de reference
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          # Premier push d'une branche, force-push ou lancement manuel :
          # pas de commit precedent utilisable, on compare au tag de depart.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse semgrep-base)"
          fi
          echo "Commit de reference : $BASE"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Semgrep - nouvelles vulnerabilites seulement
        run: >
          semgrep scan
          --config p/java
          --config p/secrets
          --baseline-commit "${{ steps.base.outputs.sha }}"
          --error
          --text-output=semgrep-nouvelles.txt
          tika-core/src/main/java

      - name: Semgrep - rapport complet
        if: always()
        run: >
          semgrep scan
          --config p/java
          --config p/secrets
          --json-output=semgrep-complet.json
          --text-output=semgrep-complet.txt
          tika-core/src/main/java

      - name: Sauvegarder les rapports Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-semgrep
          path: |
            semgrep-nouvelles.txt
            semgrep-complet.json
            semgrep-complet.txt