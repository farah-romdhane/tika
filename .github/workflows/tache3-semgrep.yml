name: Tache 3 - Semgrep

on:
  push:
    branches: [tache3]
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout (avec tout l'historique)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Autoriser git dans le conteneur
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Semgrep - nouvelles vulnerabilites seulement
        run: >
          semgrep scan
          --config p/java
          --config p/secrets
          --baseline-commit "$(git rev-parse semgrep-base)"
          --error
          --text-output=semgrep-nouvelles.txt
          tika-core/src/main/java

      - name: Semgrep - rapport complet
        if: always()
        run: >
          semgrep scan
          --config p/java
          --config p/secrets
          --json-output=semgrep-complet.json
          --text-output=semgrep-complet.txt
          tika-core/src/main/java

      - name: Sauvegarder les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-semgrep
          path: |
            semgrep-nouvelles.txt
            semgrep-complet.json
            semgrep-complet.txt
